[project]
name = "energy-cost-stats"
version = "0.1.0"
description = "Home Assistant custom integration: electricity cost per device, split by tariff zones."
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false
# The `ha` group only has a member for python_full_version < 3.14 or >= 3.14.2 (see the group
# below): homeassistant's own floor moved to 3.14.2 partway through the 3.14 series. Restricting
# the resolved environments to that same split makes `uv sync --group ha` refuse to run on
# 3.14.0/3.14.1 instead of silently installing no Home Assistant.
environments = ["python_full_version < '3.14'", "python_full_version >= '3.14.2'"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "syrupy>=4",
    "ruff>=0.6",
    "pyright[nodejs]>=1.1",
]
ha = [
    "pytest-homeassistant-custom-component==0.13.232 ; python_version < '3.14'",
    "pytest-homeassistant-custom-component>=0.13.366 ; python_full_version >= '3.14.2'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "custom_components/energy_cost_stats"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: pure-Python engine tests, no Home Assistant required",
    "integration: pytest-homeassistant-custom-component harness tests",
    "golden: real statistics fixtures compared against report snapshots",
]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "ASYNC", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "engine"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"homeassistant.components.recorder".msg = "Recorder access must go through custom_components/energy_cost_stats/recorder_adapter.py (CLAUDE.md principle 5)."

[tool.ruff.lint.per-file-ignores]
"custom_components/energy_cost_stats/recorder_adapter.py" = ["TID251"]
"tests/**" = ["TID251"]

[tool.pyright]
pythonVersion = "3.13"
include = ["custom_components", "tests"]
extraPaths = ["custom_components/energy_cost_stats"]
typeCheckingMode = "standard"
strict = ["custom_components/energy_cost_stats/engine"]
